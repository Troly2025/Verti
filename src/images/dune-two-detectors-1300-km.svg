<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img"><title>DUNE: Hai đầu hành trình</title><rect width="1200" height="960" fill="#0b182d"/><g font-family="Arial, DejaVu Sans, sans-serif" fill="#f2f0e7"><text x="70" y="100" font-size="42">DUNE: Hai đầu hành trình</text><path d="M70 136H1130" stroke="#d5b66c" stroke-width="4"/><rect x="70" y="200" width="1060" height="165" rx="16" fill="#162c48"/><text x="105" y="265" font-size="38" fill="#e7c677">Fermilab, Illinois</text><text x="105" y="318" font-size="27">Máy dò gần / Near detector</text><rect x="70" y="405" width="1060" height="165" rx="16" fill="#162c48"/><text x="105" y="470" font-size="38" fill="#e7c677">1.300 km xuyên Trái Đất</text><text x="105" y="523" font-size="27">Through the Earth; sơ đồ không theo tỷ lệ</text><rect x="70" y="610" width="1060" height="165" rx="16" fill="#162c48"/><text x="105" y="675" font-size="38" fill="#e7c677">South Dakota, gần 1,5 km sâu</text><text x="105" y="728" font-size="27">Máy dò xa / Far detector – chùm hạt dự kiến 2031</text><text x="70" y="875" font-size="23">Nguồn: CERN và Fermilab, 10/11/2026</text><text x="70" y="922" font-size="22">VERTI · Minh họa dữ kiện / Factual diagram</text></g></svg>