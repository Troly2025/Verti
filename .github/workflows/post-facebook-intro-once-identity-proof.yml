name: Verify Facebook token identity and publish one trial

on:
  push:
    branches: [main]
    paths:
      - '.github/releases/facebook-editorial-intro-2026-11-24-identity-proof.json'

permissions:
  contents: read

concurrency:
  group: facebook-editorial-intro-2026-11-24
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'Troly2025/Verti' &&
      github.ref == 'refs/heads/main' &&
      github.event.before == 'd4d2afc4683403152ffa3e759f97a7d237b79f28' &&
      github.run_attempt == 1
    environment: facebook-production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the release and exact parent without credentials
        shell: bash
        run: |
          set -euo pipefail
          base=d4d2afc4683403152ffa3e759f97a7d237b79f28
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          diff -u <(printf '%s\n' \
            $'A\t.github/releases/facebook-editorial-intro-2026-11-24-identity-proof.json' \
            $'A\t.github/workflows/post-facebook-intro-once-identity-proof.yml' \
            $'A\tscripts/facebook-editorial-intro-once-identity-proof.py') \
            <(git diff --no-renames --name-status "$base" HEAD)
          python3 -I scripts/facebook-editorial-intro-once-identity-proof.py --check
      - name: Publish exactly once and verify via Meta Graph
        shell: bash
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python3 -I scripts/facebook-editorial-intro-once-identity-proof.py
