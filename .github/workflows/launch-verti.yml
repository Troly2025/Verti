name: Launch reviewed bilingual VERTI once

on:
  push:
    branches: [main]
    paths:
      - '.github/releases/verti-bilingual-launch-2026-11-24.json'

permissions:
  contents: read

concurrency:
  group: verti-cloudflare-production-worker
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Troly2025/Verti' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Require the unique marker added on top of the reviewed main
        shell: bash
        run: |
          marker=.github/releases/verti-bilingual-launch-2026-11-24.json
          base=4e14da19cb6dcecc8f7f0f140360ce95949a2141
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          test "$(git diff --diff-filter=A --name-only "$base" HEAD -- "$marker")" = "$marker"
          test "$(jq -er .base "$marker")" = "$base"
          git diff --exit-code "$base" HEAD -- content src scripts/build.js scripts/test-build.js wrangler.jsonc
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and verify the reviewed static bundle without credentials
        shell: bash
        run: |
          npm test
          bash scripts/test-worker-release.sh
          npm run build
          wanted=$(jq -er .dist_sha256 .github/releases/verti-bilingual-launch-2026-11-24.json)
          test "$(python scripts/verti-dist-digest.py)" = "$wanted"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: reviewed-verti-static
          path: dist/
          if-no-files-found: error
          retention-days: 1

  launch:
    needs: verify
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: reviewed-verti-static
          path: dist/
      - name: Verify transferred artifact and install pinned deployment CLI before injecting credentials
        shell: bash
        run: |
          wanted=$(jq -er .dist_sha256 .github/releases/verti-bilingual-launch-2026-11-24.json)
          test "$(python scripts/verti-dist-digest.py)" = "$wanted"
          npm ci --ignore-scripts --no-fund --no-audit
      - name: Stage the exact static bundle without changing traffic
        id: stage
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: d29afda5c9fd5a4bb66ffdab0e1d5ab1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERTI_OPERATION: stage
          WRANGLER_SEND_METRICS: 'false'
        run: bash scripts/worker-release.sh
      - name: Promote only that exact verified version to 100% traffic
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: d29afda5c9fd5a4bb66ffdab0e1d5ab1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERTI_OPERATION: promote
          VERTI_VERSION_ID: ${{ steps.stage.outputs.version_id }}
          VERTI_EXPECTED_ACTIVE_VERSION: ${{ steps.stage.outputs.previous_version }}
          WRANGLER_SEND_METRICS: 'false'
        run: bash scripts/worker-release.sh
      - name: Confirm both languages and archives on the existing public domain
        shell: bash
        run: |
          temp=$(mktemp)
          trap 'rm -f "$temp"' EXIT
          for path in / /en/ /archive/ /en/archive/ /articles/panama-ita-ii-2026/ /en/articles/panama-ita-ii-2026/; do
            lang=vi
            [[ "$path" != /en/* ]] || lang=en
            ok=false
            for i in {1..6}; do
              if curl -fsS --connect-timeout 5 --max-time 10 "https://verti.ch${path}?release=${GITHUB_SHA}" -o "$temp" &&
                grep -Fq "<html lang=\"$lang\">" "$temp"; then
                ok=true; break
              fi
              sleep 3
            done
            if [[ "$ok" != true ]]; then
              echo "::error::Production traffic changed but $path did not verify. Inspect Cloudflare Deployments and the site before retrying."
              exit 1
            fi
          done
          echo "Verified public Vietnamese and English homepages, archives and representative article." >> "$GITHUB_STEP_SUMMARY"
