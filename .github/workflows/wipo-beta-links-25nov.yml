name: Add verified Facebook links to WIPO beta website articles
on:
  push:
    branches: [main]
    paths: ['.github/releases/wipo-beta-links-25nov.json']
permissions:
  contents: read
jobs:
  website:
    if: github.repository == 'Troly2025/Verti' && github.event.before == 'b5cb7395660e2e38297b8471264c15dc0c879f0c' && github.run_attempt == 1
    concurrency:
      group: verti-cloudflare-production-worker
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate site and exact static bundle
        run: |
          test "$(git rev-parse HEAD^)" = b5cb7395660e2e38297b8471264c15dc0c879f0c
          test "$(git diff --name-only HEAD^ HEAD -- content src | paste -sd,)" = "content/articles.json"
          npm test
          bash scripts/test-worker-release.sh
          npm run build
          test "$(python3 scripts/verti-dist-digest.py)" = "$(jq -er .dist_sha256 .github/releases/wipo-beta-links-25nov.json)"
          npm ci --ignore-scripts --no-fund --no-audit
      - name: Stage verified pages
        id: stage
        env:
          CLOUDFLARE_ACCOUNT_ID: d29afda5c9fd5a4bb66ffdab0e1d5ab1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERTI_OPERATION: stage
          WRANGLER_SEND_METRICS: 'false'
        run: bash scripts/worker-release.sh
      - name: Promote only that stage
        env:
          CLOUDFLARE_ACCOUNT_ID: d29afda5c9fd5a4bb66ffdab0e1d5ab1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERTI_OPERATION: promote
          VERTI_VERSION_ID: ${{ steps.stage.outputs.version_id }}
          VERTI_EXPECTED_ACTIVE_VERSION: ${{ steps.stage.outputs.previous_version }}
          WRANGLER_SEND_METRICS: 'false'
        run: bash scripts/worker-release.sh
      - name: Read public pages and images back
        shell: bash
        run: |
          set -euo pipefail
          for slug in $(jq -er '.[].slug' beta-25nov/batch.json); do
            for prefix in '' /en; do
              curl -fsSL --retry 2 --max-time 15 "https://verti.ch$prefix/articles/$slug/" > /tmp/verti-beta-page
              grep -Fq "/images/$slug.png" /tmp/verti-beta-page
              jq -er --arg s "$slug" ' .articles[] | select(.slug==$s) | .facebookPost, .facebookReel' content/articles.json | while read -r link; do grep -Fq "$link" /tmp/verti-beta-page; done
            done
            curl -fsSL --retry 2 --max-time 15 "https://verti.ch/images/$slug.png" | cmp - "src/images/$slug.png"
            echo "WEB VERIFIED $slug"
          done
